<title>Agorà</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>

:root{ --bg:#f3f1f7; --card:#ffffff; --ink:#1d1a24; --dim:#6b6578; --line:#e3dfeb; --viola:#5a3f8c; --f:'Manrope',Arial,sans-serif; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131118;--card:#1d1a24;--ink:#ece8f4;--dim:#a39cb3;--line:#2e2938;--viola:#a88be0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131118;--card:#1d1a24;--ink:#ece8f4;--dim:#a39cb3;--line:#2e2938;--viola:#a88be0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.w{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .w{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--viola)}
.logo svg{width:26px;height:26px}
header input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit}
main .w{padding-block:16px 50px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.who{display:flex;gap:10px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--viola);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block}.who span{color:var(--dim);font-size:13px}
.prof{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.post p{margin:10px 0 0}
.img{margin-top:10px;aspect-ratio:4/3;max-width:100%;border-radius:10px;background:linear-gradient(160deg,#c9bfd9,#6d5f87);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:13px;text-shadow:0 1px 2px #000}
.meta{color:var(--dim);font-size:12.5px;margin-top:8px}
.back{background:none;border:0;color:var(--viola);font:600 15px var(--f);cursor:pointer;padding:0}
.bio{white-space:pre-line}
:focus-visible{outline:2px solid var(--viola);outline-offset:2px}
</style>
