<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telefono di Marco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>

:root{
  --wall:#14202c; --ink:#f2f4f7; --dim:#9aa4b1; --glass:rgba(255,255,255,.1); --bubble-in:#2a2f36; --bubble-out:#2f7cf6;
  --app-msg:#34c759; --app-foto:#ff9f0a; --app-banca:#24476b; --app-trova:#30b0c7; --sheet:#1c1f24; --line:#30353d; --danger:#ff453a;
  --f:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0d10;color:var(--ink);font:15px/1.4 var(--f);display:flex;justify-content:center}
.phone{position:relative;width:100%;max-width:430px;min-height:100%;background:var(--wall);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:600px){body{align-items:center;padding:24px}.phone{height:min(880px,calc(100vh - 48px));min-height:0;border-radius:44px;border:10px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.sb{display:flex;justify-content:space-between;padding:10px 22px 6px;font-weight:600;font-size:14px;padding-top:max(10px,env(safe-area-inset-top,0px))}
.scr{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 24px 30px;background:radial-gradient(120% 70% at 50% 0%,#2b4a6b 0%,var(--wall) 60%)}
.big{font-size:76px;font-weight:300;letter-spacing:-2px;line-height:1;margin-top:18px}
.date{color:var(--dim);margin-top:4px}
.notif{width:100%;background:var(--glass);backdrop-filter:blur(12px);border-radius:16px;padding:10px 14px;margin-top:10px;font-size:13.5px}
.notif b{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:2px}
.pin{margin-top:auto;display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pin button{width:72px;height:72px;border-radius:50%;border:0;background:var(--glass);font-size:28px;font-weight:300}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink)}.dots i.on{background:var(--ink)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

.home{flex:1;padding:26px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:12px}
.ico{width:60px;height:60px;border-radius:15px;display:grid;place-items:center;position:relative}
.ico svg{width:32px;height:32px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.dock{margin:auto 14px 18px;background:var(--glass);border-radius:28px;padding:12px;display:flex;justify-content:space-around}

.bar{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--line);background:var(--sheet);position:sticky;top:0;z-index:2}
.bar .back{background:none;border:0;color:#4aa3ff;font-size:16px;padding:10px 8px 10px 0;min-height:44px}
.bar h1{font-size:16px;margin:0;flex:1;text-align:center}
.body{flex:1;background:#000;padding:12px 12px 20px;display:flex;flex-direction:column;gap:8px}
.day{align-self:center;color:var(--dim);font-size:11.5px;margin:8px 0 2px}
.bub{max-width:80%;padding:9px 13px;border-radius:19px;font-size:15px;line-height:1.35;white-space:pre-wrap}
.bub.in{background:var(--bubble-in);align-self:flex-start;border-bottom-left-radius:6px}
.bub.out{background:var(--bubble-out);align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.mms{border-radius:14px;overflow:hidden;background:#3a3f46;margin-top:4px}
.mms .img{height:170px;background:linear-gradient(160deg,#5a6b4f,#2f3a2a);display:flex;align-items:flex-end;padding:8px;font-size:11.5px;color:#e9ecef}
.compose{background:var(--sheet);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:#2f7cf6;color:#fff;width:100%}
.btn.ghost{background:var(--glass);color:var(--ink)}
.btn:disabled{opacity:.4}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer}
.opt input{margin-top:3px;accent-color:#2f7cf6;width:18px;height:18px;flex:none}
.lab{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:12px 2px 6px}
.t{width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font:inherit}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.card{background:var(--sheet);border-radius:14px;padding:12px 14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.small{font-size:12.5px;color:var(--dim)}
.bar h1 .doc{display:block;font:600 10.5px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;opacity:.7;margin-top:2px}
</style>
