<html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cantine Varani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

:root{
  --bord:#6d1a2a; --bord2:#4a0f1b; --avorio:#f6f0e4; --carta:#fffdf8; --ink:#2a1f1c; --grigio:#6f6560; --linea:#e5dccd; --oro:#b08a4a;
  --f:'Source Sans 3',Arial,sans-serif; --f-tit:'Cormorant Garamond',Georgia,serif; --f-mono:'IBM Plex Mono',monospace; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--avorio);color:var(--ink);font:16.5px/1.6 var(--f)}
.w{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--carta);border-bottom:1px solid var(--linea)}
header .w{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--bord)}
.logo svg{width:34px;height:34px}
.logo b{font:700 22px/1 var(--f-tit);letter-spacing:.18em}
.logo span{display:block;font:500 11px/1.2 var(--f);letter-spacing:.2em;color:var(--oro)}
nav{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px}
nav a{color:var(--ink);text-decoration:none}nav a.ris{color:var(--bord);font-weight:600}
.hero{background:linear-gradient(0deg,rgba(42,15,20,.6),rgba(42,15,20,.2)),linear-gradient(150deg,#7c6a4b,#3d4a2c);color:#fff}
.hero .w{padding-block:64px 52px}
.hero h1{font:600 clamp(34px,6vw,56px)/1.05 var(--f-tit);margin:0 0 10px;max-width:16ch;text-wrap:balance}
section .w{padding-block:36px}
h2{font:600 30px/1.15 var(--f-tit);color:var(--bord);margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.vino{background:var(--carta);border:1px solid var(--linea);border-radius:6px;padding:16px}
.vino b{font:600 21px/1.2 var(--f-tit);display:block}
.news{border-left:3px solid var(--oro);padding:4px 0 4px 14px;margin:10px 0}
footer{background:var(--bord2);color:#e8d9cf;font-size:13.5px}
footer .w{padding-block:22px;display:flex;flex-wrap:wrap;gap:10px 30px}
footer a{color:#fff}

.gest{background:#eef0f2;min-height:100vh;color:#1f2328;font:14.5px/1.5 var(--f)}
.gbar{background:#2d333b;color:#fff;font:500 13px var(--f-mono)}
.gbar .w{display:flex;justify-content:space-between;gap:10px;padding-block:10px;flex-wrap:wrap}
.gtabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0}
.gtabs button{border:1px solid #c9ced4;background:#fff;padding:7px 12px;border-radius:4px;font:inherit;cursor:pointer}
.gtabs button[aria-pressed="true"]{background:#2d333b;color:#fff;border-color:#2d333b}
.sch{background:#fff;border:1px solid #d5dae0;border-radius:4px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:72px 1fr;gap:14px}
.ft{width:72px;height:90px;background:#d5d9de;display:grid;place-items:center;font:500 10px var(--f-mono);color:#555;text-align:center}
.sch h3{margin:0;font:600 16px var(--f)}
.k{font:500 11px var(--f-mono);color:#6a737d;text-transform:uppercase;letter-spacing:.05em}
.doc{background:#fff;border:1px solid #d5dae0;border-radius:4px;padding:16px;margin-bottom:12px}
.scan{background:#e7e7e2;padding:14px;font:21px/1.35 'Cormorant Garamond',serif;font-style:italic;filter:grayscale(1);border:1px solid #ccc}
.login{max-width:380px;margin:60px auto;background:#fff;border:1px solid #d5dae0;border-radius:6px;padding:22px;display:grid;gap:10px}
.login input{width:100%;padding:10px;border:1px solid #c9ced4;border-radius:4px;font:inherit}
.login button{padding:11px;border:0;border-radius:4px;background:#2d333b;color:#fff;font:600 15px var(--f);cursor:pointer}
.err{color:#b42318;min-height:1.2em;font-size:13.5px}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
</style>
