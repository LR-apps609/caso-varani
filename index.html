<title>Questura di Valmarina</title>

<style>

:root{
  --bg:#10151d; --panel:#18202b; --panel2:#1f2936; --line:#2d3a4b; --fg:#ebe6da; --muted:#9ba5b1;
  --kraft:#d2ad6e; --alarm:#e0574a; --ok:#5fbf86; --ink:#0b0f15;
  --f-brand:'Big Shoulders Display','Arial Narrow',sans-serif; --f-body:'Libre Franklin','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; --f-type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--kraft)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrapc{max-width:980px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:1px solid var(--line)}
@media (max-width:760px){header.top{position:static}}
@media (min-width:761px){.scorri{display:none}}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.crest{width:30px;height:36px;color:var(--fg);flex:none}
.org{line-height:1.15;min-width:0}.org b{font:900 15px/1 var(--f-brand);letter-spacing:.16em;display:block}.org span{font-size:12px;color:var(--muted)}
.logo{background:var(--fg);color:var(--ink);font:900 13px/1 var(--f-brand);letter-spacing:.2em;padding:4px 7px 3px 9px;margin-left:auto;white-space:nowrap}
.status{display:flex;align-items:center;gap:14px;padding-block:8px 10px;border-top:1px solid var(--line)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.btn.sm{padding:7px 10px;font-size:13px;flex:none}
.clock{font:900 46px/1 var(--f-brand);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clockbox small{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.count{font:600 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:700 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip b{font-size:15px;line-height:1}
.chip.alarm{color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 50%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.dead{color:var(--muted)}
.meter{flex:1 1 auto;min-width:0}
.meter .track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,var(--kraft),var(--alarm));width:0}
.meter .lbl{display:flex;justify-content:space-between;font:12px var(--f-mono);color:var(--muted);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--kraft)}
.btn.primary{background:var(--kraft);color:var(--ink);border-color:var(--kraft)}
.btn.danger{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 4px;padding-block:0;border-top:1px solid var(--line)}
nav.tabs a{flex:none;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;padding:11px 12px;text-decoration:none;color:var(--muted);font:600 13px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent;position:relative}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--kraft)}
nav.tabs a .dot{position:absolute;top:7px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--alarm)}
main{padding-block:22px 80px}
h1,h2,h3{text-wrap:balance}
h2.sec{font:900 30px/1 var(--f-brand);letter-spacing:.03em;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack{display:grid;gap:14px}
label.f{display:block;font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input.t,select.t,textarea.t{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea.t{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:620px){.row2{grid-template-columns:1fr}.clock{font-size:34px}.org span{display:none}.bar{padding-block:8px}.count{font-size:12.5px}.chip{font-size:10.5px;padding:3px 8px}.clockbox small{display:none}}
.err{color:var(--alarm);font-weight:600;min-height:1.2em}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(560px,92%);background:var(--panel);border:1px solid var(--line);border-radius:12px;border-top-left-radius:3px;padding:9px 12px}
.msg .who{font:600 12px/1 var(--f-body);letter-spacing:.06em;color:var(--kraft);margin-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.msg .who time{color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.msg.kid{border-color:color-mix(in srgb,var(--alarm) 55%,var(--line))}.msg.kid .who{color:var(--alarm)}
.msg.kid .body{font-family:var(--f-type)}
.msg.me{align-self:flex-end;background:var(--panel2);border-top-left-radius:12px;border-top-right-radius:3px}.msg.me .who{color:var(--muted)}
.msg.sys{align-self:center;background:transparent;border-style:dashed;text-align:center}
.media{margin-top:8px;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.02) 10px 20px)}
.composer{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.composer input{flex:1;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.site{display:flex;flex-direction:column;gap:6px}
.site h3{margin:0;font:800 16px/1.2 var(--f-body)}.site p{margin:0;color:var(--muted);font-size:13.5px}
.site .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:12px var(--f-mono);color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.site.locked{opacity:.55}

.docs{display:flex;flex-wrap:wrap;gap:6px}
.docs button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;min-width:56px;min-height:44px;padding:10px 12px;font:600 14px/1 var(--f-mono);cursor:pointer}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.confirm .lvls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chiaro{background:#f6f4ee;color:#1d1d1d;border-radius:8px;padding:10px;overflow-x:auto}
.chiaro *{color:inherit}
.docs button[aria-pressed="true"]{background:var(--kraft);color:var(--ink);border-color:var(--kraft)}
.result{border-left:4px solid var(--kraft);background:var(--panel2);padding:14px 16px;border-radius:0 8px 8px 0}
.result.ok{border-color:var(--ok)}.result.bad{border-color:var(--alarm)}
.result h3{margin:0 0 6px;font:900 24px/1.1 var(--f-brand);letter-spacing:.03em}
.order{counter-reset:o;list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.order li{counter-increment:o;display:flex;gap:10px;align-items:center}
.order li::before{content:counter(o);width:26px;height:26px;border-radius:50%;background:var(--kraft);color:var(--ink);font:900 15px/26px var(--f-brand);text-align:center;flex:none}

.sitebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:#fff;padding:10px 14px;border-radius:8px;font-size:14px}
.stbl{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}.stbl th,.stbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.stbl th{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.person .ava{width:52px;height:52px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:900 20px/1 var(--f-brand);letter-spacing:.04em;flex:none}
.person h3{margin:0 0 2px;font:800 15px/1.2 var(--f-body)}.person p{margin:0;font-size:13px;color:var(--muted)}
.person.off .ava{opacity:.5}
.tag2{display:inline-block;margin-top:6px;font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid var(--line)}
.tag2.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}.tag2.no{color:var(--muted)}
.qs{display:flex;flex-wrap:wrap;gap:8px}
.qs button{text-align:left}
.msg.sus{border-color:color-mix(in srgb,var(--kraft) 45%,var(--line))}

.hint{display:grid;gap:8px}
.hint h3{margin:0;font:800 16px/1.2 var(--f-body)}
.lvls{display:flex;gap:8px;flex-wrap:wrap}
.reveal{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.reveal b{color:var(--kraft);font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}

.gate{max-width:520px;margin:6vh auto 0;text-align:left}
.gate .big{font:900 56px/.9 var(--f-brand);letter-spacing:.01em;margin:10px 0 12px}
.modes{display:grid;gap:10px;margin:14px 0}
.mode{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel)}
.mode input{margin-top:4px;accent-color:var(--kraft)}
.mode b{display:block}.mode span{color:var(--muted);font-size:13.5px}
.confirm{border:1px solid var(--alarm);border-radius:8px;padding:12px;background:color-mix(in srgb,var(--alarm) 10%,transparent)}
.warn{border:1px solid var(--line,#888);border-left:4px solid var(--alarm);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45;text-align:left}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.msg.new{animation:pop .5s ease}@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}}
</style>
